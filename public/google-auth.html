<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign in - Google Accounts</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <style>
    body {
      font-family: 'Roboto', sans-serif;
      background-color: #f0f4f9;
    }
    .google-card {
      background: #ffffff;
      border-radius: 28px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
    }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">
  <div class="w-full max-w-[450px] google-card p-10 relative overflow-hidden">
    
    <!-- Top Google Logo & Header -->
    <div class="flex flex-col items-center text-center mb-8">
      <!-- Google Color G Logo -->
      <svg class="w-12 h-12 mb-4" viewBox="0 0 24 24" width="48px" height="48px">
        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
        <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l3.66-2.85z"/>
        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.85c.87-2.6 3.3-4.53 6.16-4.53z"/>
      </svg>
      <h1 class="text-[24px] font-normal text-[#1f1f1f] tracking-tight">Sign in</h1>
      <p class="text-sm text-[#444746] mt-2">to continue to <strong class="text-emerald-700">SureDev</strong></p>
    </div>

    <!-- Google Sign-In Button Container -->
    <div id="g_id_onload" 
         data-client_id=""
         data-callback="handleCredentialResponse"
         data-auto_select="false"
         class="flex justify-center my-6">
    </div>
    <div id="g_id_signin" 
         data-type="standard" 
         data-size="large" 
         data-theme="outline" 
         data-text="signin" 
         data-shape="rectangular" 
         data-logo_alignment="left"
         class="w-full flex justify-center">
    </div>

    <!-- Loading State View -->
    <div id="loader-view" class="hidden absolute inset-0 bg-white flex flex-col items-center justify-center p-10 z-20 rounded-3xl">
      <div class="relative w-16 h-16 mb-4">
        <div class="absolute inset-0 rounded-full border-4 border-gray-100"></div>
        <div class="absolute inset-0 rounded-full border-4 border-blue-600 border-t-transparent animate-spin"></div>
      </div>
      <p class="text-sm font-medium text-[#1f1f1f]">Signing in with Google...</p>
      <p id="connecting-to" class="text-xs text-[#5f6368] mt-1"></p>
    </div>

    <!-- Error Message Display -->
    <div id="error-message" class="hidden mt-4 p-4 bg-red-50 border border-red-200 rounded-xl text-sm text-red-700">
      <p id="error-text"></p>
    </div>

    <!-- Footer Security Notice -->
    <div class="mt-8 pt-6 border-t border-gray-100 flex justify-between items-center text-xs text-[#5f6368]">
      <span class="flex items-center gap-1">
        <svg class="w-3.5 h-3.5 text-green-600" fill="currentColor" viewBox="0 0 20 20">
          <path fill-rule="evenodd" d="M5 9V7a5 5 0 0110 0v2a2 2 0 012 2v5a2 2 0 01-2 2H5a2 2 0 01-2-2v-5a2 2 0 012-2zm8-2v2H7V7a3 3 0 016 0z" clip-rule="evenodd"></path>
        </svg>
        Secure SSL Connection
      </span>
      <a href="https://policies.google.com" target="_blank" class="hover:underline">Privacy & Terms</a>
    </div>

  </div>

  <script>
    // Get Google OAuth Client ID from environment or URL params
    const params = new URLSearchParams(window.location.search);
    const clientId = params.get('client_id') || '';

    if (!clientId) {
      document.getElementById('error-message').classList.remove('hidden');
      document.getElementById('error-text').innerText = 'Google OAuth Client ID is not configured. Please contact support.';
      console.error('Google OAuth Client ID is missing');
    }

    function handleCredentialResponse(response) {
      document.getElementById('loader-view').classList.remove('hidden');
      document.getElementById('connecting-to').innerText = 'Processing...';

      try {
        // Decode JWT token (note: in production, verify on server side)
        const token = response.credential;
        const base64Url = token.split('.')[1];
        const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
        const jsonPayload = decodeURIComponent(
          atob(base64)
            .split('')
            .map((c) => '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2))
            .join('')
        );
        
        const payload = JSON.parse(jsonPayload);
        const { name, email, picture } = payload;

        if (window.opener) {
          window.opener.postMessage({
            type: 'GOOGLE_AUTH_SUCCESS',
            user: { 
              name, 
              email, 
              avatar: picture,
              idToken: token
            }
          }, window.location.origin);
          
          setTimeout(() => window.close(), 1500);
        } else {
          alert('Authentication complete! Close this window and return to the SureDev application tab.');
          window.close();
        }
      } catch (error) {
        console.error('Error processing Google credential:', error);
        document.getElementById('loader-view').classList.add('hidden');
        document.getElementById('error-message').classList.remove('hidden');
        document.getElementById('error-text').innerText = 'Failed to process Google authentication. Please try again.';
      }
    }

    function onLoad() {
      if (clientId) {
        google.accounts.id.initialize({ client_id: clientId });
        google.accounts.id.renderButton(
          document.getElementById('g_id_signin'),
          { theme: 'outline', size: 'large', text: 'signin' }
        );
      }
    }

    // Initialize when Google SDK is loaded
    if (window.google) {
      onLoad();
    }

    window.onload = onLoad;
  </script>
</body>
</html>
