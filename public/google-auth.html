<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign in - Google Accounts</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      font-family: 'Roboto', sans-serif;
      background-color: #f0f4f9;
    }
    .google-card {
      background: #ffffff;
      border-radius: 28px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
    }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">
  <div class="w-full max-w-[450px] google-card p-10 relative overflow-hidden">
    
    <!-- Top Google Logo & Header -->
    <div class="flex flex-col items-center text-center mb-8">
      <!-- Google Color G Logo -->
      <svg class="w-12 h-12 mb-4" viewBox="0 0 24 24" width="48px" height="48px">
        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
        <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l3.66-2.85z"/>
        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.85c.87-2.6 3.3-4.53 6.16-4.53z"/>
      </svg>
      <h1 class="text-[24px] font-normal text-[#1f1f1f] tracking-tight">Choose an account</h1>
      <p class="text-sm text-[#444746] mt-2">to continue to <strong class="text-emerald-700">SureDev Abia</strong></p>
    </div>

    <!-- Active State: Choose Account Screen -->
    <div id="accounts-screen" class="space-y-3.5">
      <!-- Account 1: User's Actual Email -->
      <button onclick="selectAccount('Chigozie Orji', 'chigozieorji43@gmail.com', 'https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?auto=format&fit=crop&q=80&w=120&h=120')" 
              class="w-full p-4 flex items-center gap-3 rounded-2xl border border-gray-200 hover:bg-[#f8fafd] transition-colors text-left group">
        <img src="https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?auto=format&fit=crop&q=80&w=120&h=120" 
             alt="User Avatar" class="w-10 h-10 rounded-full border border-gray-100 object-cover">
        <div class="flex-1">
          <span class="block text-sm font-medium text-[#1f1f1f] group-hover:text-blue-600 transition-colors">Chigozie Orji</span>
          <span class="block text-xs text-[#5f6368]">chigozieorji43@gmail.com</span>
        </div>
        <span class="text-[10px] font-mono bg-emerald-50 text-emerald-700 px-2 py-1 rounded font-bold uppercase border border-emerald-100">Active</span>
      </button>

      <!-- Account 2: Abia Dev Local Guest Account -->
      <button onclick="selectAccount('Chioma Nnaji', 'chioma@suredev.ng', 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&q=80&w=120&h=120')" 
              class="w-full p-4 flex items-center gap-3 rounded-2xl border border-gray-200 hover:bg-[#f8fafd] transition-colors text-left group">
        <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&q=80&w=120&h=120" 
             alt="User Avatar" class="w-10 h-10 rounded-full border border-gray-100 object-cover">
        <div class="flex-1">
          <span class="block text-sm font-medium text-[#1f1f1f] group-hover:text-blue-600 transition-colors">Chioma Nnaji (Developer)</span>
          <span class="block text-xs text-[#5f6368]">chioma@suredev.ng</span>
        </div>
      </button>

      <!-- Custom Account Button -->
      <button onclick="showCustomForm()" 
              class="w-full p-4 flex items-center gap-3 rounded-2xl border border-gray-200 hover:bg-[#f8fafd] transition-colors text-left text-sm font-medium text-blue-600">
        <div class="w-10 h-10 rounded-full bg-blue-50 text-blue-600 flex items-center justify-center">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path>
          </svg>
        </div>
        Use another Google account
      </button>
    </div>

    <!-- Custom Account Input Form -->
    <div id="custom-form" class="hidden space-y-4 animate-fadeIn">
      <div>
        <label class="block text-xs font-semibold text-[#444746] uppercase mb-1">Google Name</label>
        <input type="text" id="custom-name" placeholder="e.g. Ama Okafor" 
               class="w-full px-4 py-3 rounded-xl border border-gray-300 focus:border-blue-500 outline-none text-sm text-[#1f1f1f]">
      </div>
      <div>
        <label class="block text-xs font-semibold text-[#444746] uppercase mb-1">Gmail Address</label>
        <input type="email" id="custom-email" placeholder="e.g. ama@gmail.com" 
               class="w-full px-4 py-3 rounded-xl border border-gray-300 focus:border-blue-500 outline-none text-sm text-[#1f1f1f]">
      </div>
      <div class="flex gap-2 justify-end pt-2">
        <button onclick="hideCustomForm()" class="px-4 py-2.5 rounded-xl hover:bg-gray-100 text-[#444746] font-medium text-sm transition-colors">Cancel</button>
        <button onclick="submitCustomAccount()" class="px-5 py-2.5 rounded-xl bg-blue-600 hover:bg-blue-700 text-white font-medium text-sm transition-all shadow-sm">Continue</button>
      </div>
    </div>

    <!-- Loading State View -->
    <div id="loader-view" class="hidden absolute inset-0 bg-white flex flex-col items-center justify-center p-10 z-20">
      <div class="relative w-16 h-16 mb-4">
        <div class="absolute inset-0 rounded-full border-4 border-gray-100"></div>
        <div class="absolute inset-0 rounded-full border-4 border-blue-600 border-t-transparent animate-spin"></div>
      </div>
      <p class="text-sm font-medium text-[#1f1f1f]">Signing in with Google...</p>
      <p id="connecting-to" class="text-xs text-[#5f6368] mt-1"></p>
    </div>

    <!-- Footer Security Notice -->
    <div class="mt-8 pt-6 border-t border-gray-100 flex justify-between items-center text-xs text-[#5f6368]">
      <span class="flex items-center gap-1">
        <svg class="w-3.5 h-3.5 text-green-600" fill="currentColor" viewBox="0 0 20 20">
          <path fill-rule="evenodd" d="M5 9V7a5 5 0 0110 0v2a2 2 0 012 2v5a2 2 0 01-2 2H5a2 2 0 01-2-2v-5a2 2 0 012-2zm8-2v2H7V7a3 3 0 016 0z" clip-rule="evenodd"></path>
        </svg>
        Secure SSL Connection
      </span>
      <a href="https://policies.google.com" target="_blank" class="hover:underline">Privacy & Terms</a>
    </div>

  </div>

  <script>
    function showCustomForm() {
      document.getElementById('accounts-screen').classList.add('hidden');
      document.getElementById('custom-form').classList.remove('hidden');
    }

    function hideCustomForm() {
      document.getElementById('custom-form').classList.add('hidden');
      document.getElementById('accounts-screen').classList.remove('hidden');
    }

    function submitCustomAccount() {
      const name = document.getElementById('custom-name').value.trim();
      const email = document.getElementById('custom-email').value.trim();
      if (!name || !email) {
        alert('Please provide both name and a valid email.');
        return;
      }
      selectAccount(name, email, 'https://images.unsplash.com/photo-1472099645785-5658abf4ff4e?auto=format&fit=crop&q=80&w=120&h=120');
    }

    function selectAccount(name, email, avatar) {
      document.getElementById('loader-view').classList.remove('hidden');
      document.getElementById('connecting-to').innerText = email;

      setTimeout(() => {
        if (window.opener) {
          window.opener.postMessage({
            type: 'GOOGLE_AUTH_SUCCESS',
            user: { name, email, avatar }
          }, '*');
          window.close();
        } else {
          alert('Authentication complete! Close this window and return to the SureDev application tab.');
        }
      }, 1500);
    }
  </script>
</body>
</html>
